<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="四択を1回タップするだけの静かなクイズ画面">
  <title>Quiz</title>
  <link rel="stylesheet" href="https://unpkg.com/survey-core@3.0.2/survey-core.min.css">
  <link rel="stylesheet" href="./css/app.css">
</head>
<body>
  <main class="shell">
    <header class="header">
      <div class="heading">
        <h1 id="title">Quiz</h1>
        <p id="summary" role="status" aria-live="polite" aria-atomic="true">読み込み中</p>
        <a id="reference-link" target="_blank" rel="noopener noreferrer" hidden>公式問題を開く</a>
        <div class="pickers">
          <label class="picker" for="exam-select"><span>試験</span><select id="exam-select" aria-label="試験を選ぶ"></select></label>
          <label class="picker" for="session-select"><span>試験回</span><select id="session-select" aria-label="試験回を選ぶ"></select></label>
          <label class="picker" for="module-select"><span>問題範囲</span><select id="module-select" aria-label="問題範囲を選ぶ" disabled></select></label>
        </div>
        <details class="review-tools">
          <summary>復習・回答の操作</summary>
          <div class="tools" aria-label="復習する問題を選ぶ">
            <button class="copy-button" type="button" data-review-filter="all" aria-pressed="true">すべて</button>
            <button class="copy-button" type="button" data-review-filter="unanswered" aria-pressed="false">未回答</button>
            <button class="copy-button" type="button" data-review-filter="incorrect" aria-pressed="false">不正解</button>
            <button id="reset-session" class="copy-button" type="button" disabled>この試験回をやり直す</button>
            <button id="copy-all" class="copy-button" type="button" disabled>回答をChatGPT用にコピー</button>
            <span id="copy-status" role="status" aria-live="polite"></span>
          </div>
        </details>
      </div>
    </header>
    <section id="quiz" aria-label="クイズ"></section>
  </main>

  <script src="https://unpkg.com/survey-core@3.0.2/survey.core.min.js"></script>
  <script src="https://unpkg.com/survey-js-ui@3.0.2/survey-js-ui.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/markdown-it@14.1.0/dist/markdown-it.min.js"></script>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
