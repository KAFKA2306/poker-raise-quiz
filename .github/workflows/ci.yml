name: 自動確認

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: 構造・本番データ・実動を確認
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v7

      - name: Node.js 24を用意
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: 構造・JavaScript・問題データを確認
        run: node scripts/validate.mjs

      - name: fallbackが再導入されていないことを確認
        run: node scripts/validate-fail-fast.mjs

      - name: ブラウザ用データローダーと回答保存を実動確認
        run: node scripts/test-runtime.mjs
