name: 自動確認

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: 構造・本番データ・ブラウザを確認
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v7

      - name: Node.js 24を用意
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: 構造・JavaScript・問題データを確認
        run: node scripts/validate.mjs

      - name: Chromeを確認
        run: /usr/bin/google-chrome --version

      - name: 実ブラウザで主要操作を確認
        run: node scripts/smoke-browser.mjs

      - name: 画面確認画像を保存
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-smoke-${{ github.run_id }}
          path: artifacts/browser-smoke/*.png
          if-no-files-found: warn
