name: 自動確認

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: 構造と本番データを確認
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v7

      - name: Node.js 24を用意
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: PDF解答表の読取りツールを用意
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: 本番問題データを再生成
        run: node scripts/prepare-data.mjs

      - name: 構造・JavaScript・問題データを確認
        run: node scripts/validate.mjs
